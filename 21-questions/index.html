<section class="screen" id="s-gisetup">

  <label>Category (optional)</label>
  <div class="chips" id="catChips"></div>
  <button class="btn pink" data-act="useTyped">Use my secret</button>

 </div>
</section>

<section class="screen" id="s-gireveal">
 <h2>Your secret</h2><p class="sub" id="revCat"></p>
 <div class="secret hid" id="revSecret"></div>
 <button class="btn ghost" data-act="toggleReveal" id="revToggle">👁 Reveal</button>
 <button class="btn ghost" data-act="giveOne">🎲 Another one</button>
 <button class="btn pink" data-act="handOver">Got it, hand over</button>
</section>

<section class="screen" id="s-giplay">
 <p class="turn" id="playLine"></p>
 <div class="count" id="count">21</div><p class="sub" style="margin-top:4px">questions left <span id="catHint"></span></p>
 <input id="qText" maxlength="80" placeholder="Question text (optional)">
 <div class="ans3">
  <button class="btn green" data-act="ans" data-v="y">Yes</button>
  <button class="btn red" data-act="ans" data-v="n">No</button>
  <button class="btn amber full" data-act="ans" data-v="m">Sometimes / Maybe</button>
 </div>
 <button class="btn pink" data-act="guess" style="min-height:64px;font-size:22px">🎯 Guess!</button>
 <ul class="log" id="log"></ul>
 <button class="btn ghost small" data-act="undo">↶ Undo last</button>
 <button class="btn ghost small" data-act="peek">👁 Setter peek</button>
</section>

<section class="screen" id="s-giresult">
 <h1 id="resTitle"></h1><p class="sub" id="resSub"></p>
 <p class="center muted">The secret was</p><div class="secret" id="resSecret"></div>
 <div class="big-card score"><div><b id="rs1">0</b><span id="rsn1"></span></div><div><b id="rs2">0</b><span id="rsn2"></span></div></div>
 <button class="btn pink" data-act="giNext">Next round (swap roles) ➜</button>
 <button class="btn ghost" data-act="resetScores">Reset scores</button>
</section>

<section class="screen" id="s-gkdeck">
 <h2>Get to Know You</h2>
 <div class="big-card"><label>Players (optional, comma separated)</label><input id="gkNames" placeholder="e.g. Sam, Alex, Jo"></div>
 <div class="decks" id="decks"></div>
</section>

<section class="screen" id="s-gkplay">

 <div class="prog"><i id="gkProg"></i></div>
 <p class="turn" id="gkTurn"></p>
 <div class="big-card"><div class="q" id="gkQ"></div></div>
 <div class="row"><button class="btn ghost" data-act="gkBack">◀ Back</button><button class="btn ghost" data-act="gkSkip">Skip ⤼</button></div>
 <button class="btn gold" data-act="gkNext" style="min-height:66px;font-size:22px">Next ➜</button>
</section>

<section class="screen" id="s-gkend">
 <h1>🎉 21 done!</h1><p class="sub" id="gkEndSub"></p>
 <button class="btn gold" data-act="gkAnother">Another 21</button>
 <button class="btn ghost" data-act="gkStart">Change deck</button>
 <button class="btn ghost" data-act="home">Home</button>
</section>
</div>

/* ---------- navigation & overlay ---------- */
var ov=$("ov");
function closeOverlay(){ov.classList.remove("on");$("dlgB").innerHTML="";dlgCbs=[];}
var dlgCbs=[];
function dialog(title,msg,buttons){
  $("dlgT").textContent=title;$("dlgM").textContent=msg;dlgCbs=[];
  $("dlgB").innerHTML=buttons.map(function(b,i){dlgCbs.push(b.fn||null);return '<button class="btn '+(b.cls||"")+'" data-dlg="'+i+'">'+esc(b.label)+'</button>';}).join("");
  ov.classList.add("on");
}
ov.addEventListener("click",function(e){
  var b=e.target.closest("[data-dlg]");
  if(!b){if(e.target===ov&&ov.dataset.lock!=="1")closeOverlay();return;}
  var fn=dlgCbs[+b.dataset.dlg];closeOverlay();if(fn)fn();
});
var cur="home";
function show(name){
  closeOverlay();
  try{document.activeElement&&document.activeElement.blur&&document.activeElement.blur();}catch(e){}
  var s=document.querySelectorAll(".screen");for(var i=0;i<s.length;i++)s[i].classList.toggle("on",s[i].id==="s-"+name);
  cur=name;window.scrollTo(0,0);
}

/* ---------- Guess It ---------- */
var G=LS.get("q21_gi",null)||{names:["",""],scores:[0,0],setter:0};
if(!G.names||!G.scores){G={names:["",""],scores:[0,0],setter:0};}
var R={secret:"",cat:"Anything",left:21,log:[],revealed:false};
function nm(i){return (G.names[i]||"").trim()||("Player "+(i+1));}
function saveG(){LS.set("q21_gi",G);}
function renderSetup(){
  $("p1").value=G.names[0]||"";$("p2").value=G.names[1]||"";
  $("sc1").textContent=G.scores[0];$("sc2").textContent=G.scores[1];$("scn1").textContent=nm(0);$("scn2").textContent=nm(1);
  $("roleLine").textContent="🤫 "+nm(G.setter)+" sets the secret — "+nm(1-G.setter)+" look away!";
  $("catChips").innerHTML=CATS.map(function(c){return '<button class="chip'+(c===R.cat?" sel":"")+'" data-act="cat" data-v="'+c+'">'+c+'</button>';}).join("");
}
function readNames(){G.names=[$("p1").value.slice(0,16),$("p2").value.slice(0,16)];saveG();}
["p1","p2"].forEach(function(id){$(id).addEventListener("input",function(){readNames();$("scn1").textContent=nm(0);$("scn2").textContent=nm(1);$("roleLine").textContent="🤫 "+nm(G.setter)+" sets the secret — "+nm(1-G.setter)+" look away!";});});
function startPlay(){R.left=21;R.log=[];$("qText").value="";renderPlay();show("giplay");}
function renderPlay(){
  var c=$("count");c.textContent=R.left;c.classList.toggle("low",R.left<=5);
  $("playLine").textContent="❓ "+nm(1-G.setter)+" asks · "+nm(G.setter)+" answers";
  $("catHint").textContent=R.cat!=="Anything"?"· Category: "+R.cat:"";
  var map={y:["Yes","t-y"],n:["No","t-n"],m:["Maybe","t-m"],gw:["Wrong guess","t-g"]};
  $("log").innerHTML=R.log.slice().reverse().map(function(e,i){var m=map[e.v];return '<li><span class="tag '+m[1]+'">'+m[0]+'</span><span>#'+(R.log.length-i)+' '+esc(e.q||"")+'</span></li>';}).join("");
}
function finish(guesserWon){
  var w=guesserWon?1-G.setter:G.setter;G.scores[w]++;saveG();
  $("resTitle").textContent=guesserWon?"🎉 Got it!":"😈 Stumped!";
  $("resSub").textContent=guesserWon?nm(w)+" guessed it with "+(21-R.left)+" question"+(21-R.left===1?"":"s")+" used.":"Out of questions — "+nm(w)+" (setter) wins!";
  $("resSecret").textContent=R.secret;
  $("rs1").textContent=G.scores[0];$("rs2").textContent=G.scores[1];$("rsn1").textContent=nm(0);$("rsn2").textContent=nm(1);
  show("giresult");
}
function useQuestion(v){
  R.log.push({v:v,q:$("qText").value.trim()});$("qText").value="";R.left--;renderPlay();
  if(R.left<=0)finish(false);
}
function randomSecret(){var l=SECRETS[R.cat]||SECRETS.Anything;var s;do{s=l[Math.floor(Math.random()*l.length)];}while(l.length>1&&s===R.secret);return s;}

/* ---------- Get to Know ---------- */
var K={deck:null,order:[],pos:0,hist:[],idx:0,players:[],turn:0};
var used=LS.get("q21_used",{})||{};
function renderDecks(){
  $("gkNames").value=(LS.get("q21_gkn",[])||[]).join(", ");
  $("decks").innerHTML=Object.keys(DECKS).map(function(k){var d=DECKS[k];return '<button class="btn '+d.cls+'" data-act="deck" data-v="'+k+'">'+d.icon+" "+d.name+'<span>'+d.desc+" · "+d.q.length+' questions</span></button>';}).join("");
}
function nextFromDeck(){
  var d=DECKS[K.deck],u=used[K.deck]||[];
  if(u.length>=d.q.length)u=[];
  var avail=[];for(var i=0;i<d.q.length;i++)if(u.indexOf(i)<0)avail.push(i);
  var pick=avail[Math.floor(Math.random()*avail.length)];u.push(pick);used[K.deck]=u;LS.set("q21_used",used);return pick;
}
function startRound(){K.hist=[nextFromDeck()];K.idx=0;K.turn=0;renderGk();show("gkplay");}
function renderGk(){
  var d=DECKS[K.deck];$("gkDeckName").textContent=d.icon+" "+d.name;
  $("gkCount").textContent=(K.idx+1)+"/21";$("gkProg").style.width=((K.idx+1)/21*100)+"%";
  $("gkQ").textContent=d.q[K.hist[K.idx]];
  $("gkTurn").textContent=K.players.length?"🎤 "+K.players[K.idx%K.players.length]+"'s turn":"";
}
function gkAdvance(skip){
  if(skip){K.hist[K.idx]=nextFromDeck();renderGk();return;}
  if(K.idx>=20){$("gkEndSub").textContent="You finished 21 questions from "+DECKS[K.deck].name+".";show("gkend");return;}
  K.idx++;if(K.idx>=K.hist.length)K.hist.push(nextFromDeck());renderGk();
}
function pickDeck(k){
  var names=$("gkNames").value.split(",").map(function(s){return s.trim();}).filter(Boolean).slice(0,12);
  K.players=names;LS.set("q21_gkn",names);
  var go=function(){K.deck=k;startRound();};
  if(DECKS[k].adult){
    if(LS.get("q21_adult",false)===true||K.adultOk){go();return;}
    dialog("Are you 18+?","The Spicy deck is cheeky and flirty (not explicit). Everyone playing should be 18 or older.",[
      {label:"Yes, we're all 18+",cls:"red",fn:function(){K.adultOk=true;LS.set("q21_adult",true);go();}},
      {label:"No, take me back",cls:"ghost"}]);
    return;
  }
  go();
}

/* ---------- actions ---------- */
var A={
 home:function(){show("home");},
 menu:function(){
  dialog("Menu","",[{label:"🏠 Home",cls:"pink",fn:function(){show("home");}},
   {label:"🕵️ Guess It",fn:function(){A.giStart();}},{label:"💬 Get to Know You",fn:function(){A.gkStart();}},
   {label:"Close",cls:"ghost"}]);
 },
 giStart:function(){R.secret="";$("secretIn").value="";renderSetup();show("gisetup");},
 cat:function(b){R.cat=b.dataset.v;renderSetup();},
 useTyped:function(){
  var v=$("secretIn").value.trim();
  if(!v){dialog("No secret yet","Type a secret thing, or tap 'Give me one'.",[{label:"OK",cls:"pink"}]);return;}
  readNames();R.secret=v.slice(0,60);$("secretIn").value="";startPlay();
 },
 giveOne:function(){readNames();R.secret=randomSecret();R.revealed=false;
  $("revSecret").textContent=R.secret;$("revSecret").classList.add("hid");$("revToggle").textContent="👁 Reveal";
  $("revCat").textContent="Category: "+R.cat+" · only "+nm(G.setter)+" look!";show("gireveal");},
 toggleReveal:function(){R.revealed=!R.revealed;$("revSecret").classList.toggle("hid",!R.revealed);$("revToggle").textContent=R.revealed?"🙈 Hide":"👁 Reveal";},
 handOver:function(){$("revSecret").classList.add("hid");startPlay();},
 ans:function(b){useQuestion(b.dataset.v);},
 undo:function(){if(R.log.length){R.log.pop();R.left++;renderPlay();}},
 peek:function(){dialog("Setter only 🤫",R.secret,[{label:"Hide",cls:"pink"}]);},
 guess:function(){
  dialog("Guess time!",nm(1-G.setter)+" makes a guess. "+nm(G.setter)+", was it right?",[
   {label:"✅ Correct",cls:"green",fn:function(){finish(true);}},
   {label:"❌ Wrong (costs a question)",cls:"red",fn:function(){$("qText").value=$("qText").value||"";useQuestion("gw");}},
   {label:"Cancel",cls:"ghost"}]);
 },
 giNext:function(){G.setter=1-G.setter;saveG();A.giStart();},
 resetScores:function(){dialog("Reset scores?","Both scores go back to 0.",[{label:"Reset",cls:"red",fn:function(){G.scores=[0,0];saveG();$("rs1").textContent=0;$("rs2").textContent=0;}},{label:"Cancel",cls:"ghost"}]);},
 gkStart:function(){renderDecks();show("gkdeck");},
 deck:function(b){pickDeck(b.dataset.v);},
 gkNext:function(){gkAdvance(false);},
 gkSkip:function(){gkAdvance(true);},
 gkBack:function(){if(K.idx>0){K.idx--;renderGk();}},
 gkAnother:function(){startRound();}
};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var f=A[b.dataset.act];if(f){e.preventDefault();f(b);}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ov.classList.contains("on"))closeOverlay();});
window.__q21={show:show,R:R,G:G,K:K,DECKS:DECKS,SECRETS:SECRETS};
})();
</script></body></html>

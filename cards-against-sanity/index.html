p{margin:0}

.btn.danger{background:#c62828;border-color:#c62828;color:#fff}

.row{display:flex;gap:10px}

.white .ans,.sub .ans{background:#000;color:#fff}
.hand{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.footer{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,#141414 75%,rgba(20,20,20,0));padding:22px 16px calc(14px + env(safe-area-inset-bottom));z-index:20}

        blackHTML(b, []) +
        '<p class="center"><b>' + (cz.bot ? 'Someone read this card out loud. ' + esc(cz.name) + ' will judge.' : esc(cz.name) + ', read this card out loud.') + '</b><br><span class="muted">' + (b.pick > 1 ? 'Everyone plays 2 cards, in order.' : 'Everyone plays 1 card.') + (G.subs.length ? ' The bots have already played. 🤖' : '') + '</span></p>' +
        footer('<button class="btn" data-act="beginSubs">' + (G.queue.length ? 'Start: pass to ' + esc(G.players[G.queue[0]].name) : 'Reveal the answers') + '</button><button class="btn ghost" data-act="scores">Scoreboard</button>');
      return { html: h, footer: true };
    },
    pass: function () {
      var p = G.players[G.queue[G.qi]];
      return { html: topbar('Round ' + G.round) +
        '<div class="pass-wrap"><div class="big-emoji">📱</div><div class="muted">Pass the phone to</div><div class="pass-name">' + esc(p.name) + '</div>' +
        '<p class="muted">Everyone else, no peeking. ' + (G.qi + 1) + ' of ' + G.queue.length + ' players.</p>' +
        '<button class="btn" data-act="showHand">I\'m ' + esc(p.name) + ': show my cards</button></div>' };
    },
    pick: function () {
      var pi = G.queue[G.qi];
      var p = G.players[pi];
      var b = card(G.black);
      var answers = ui.sel.map(function (id) { return card(id).text; });
      var h = topbar(p.name + ' · ' + p.score + ' pt' + (p.score === 1 ? '' : 's')) +
        blackHTML(b, answers, true) +
        '<p class="center"><b>' + (b.pick > 1 ? 'Pick 2 cards, in order (' + ui.sel.length + '/2)' : 'Pick 1 card') + '</b> <span class="muted">· tap again to unpick</span></p>' +
        '<div class="hand">' + p.hand.map(function (id) {
          var c = card(id); var n = ui.sel.indexOf(id);
          return '<button class="wcard' + (n >= 0 ? ' sel' : '') + '" data-act="pickCard" data-id="' + id + '">' + esc(whiteDisplay(c.text)) +
            (n >= 0 ? '<span class="num">' + (b.pick > 1 ? (n + 1) : '✓') + '</span>' : '') + '</button>';
        }).join('') + '</div>' +
        footer('<button class="btn" data-act="submit"' + (ui.sel.length === b.pick ? '' : ' disabled') + '>Hide &amp; pass</button>' +
          '<button class="btn ghost" data-act="swapAsk"' + (p.score >= 1 ? '' : ' disabled') + '>Swap hand (costs 1 point)</button>');
      return { html: h, footer: true };
    },
    passCzar: function () {
      var cz = G.players[G.czar];
      return { html: topbar('Round ' + G.round) +
        '<div class="pass-wrap"><div class="big-emoji">👑</div><div class="muted">All answers are in! Pass the phone to the Card Czar</div><div class="pass-name">' + esc(cz.name) + '</div>' +
        '<button class="btn" data-act="showJudge">I\'m ' + esc(cz.name) + ': show the answers</button></div>' };
    },
    botJudge: function () {
      var cz = G.players[G.czar];
      return { html: topbar('Round ' + G.round) +
        '<div class="pass-wrap"><div class="big-emoji">🤖</div><div class="muted">All answers are in! The Card Czar is</div><div class="pass-name">' + esc(cz.name) + '</div>' +
        '<div class="thinking" aria-label="Thinking"><i></i><i></i><i></i></div><p class="muted">Thinking very hard about it…</p>' +
        blackHTML(card(G.black), [], true) + '</div>' };
    },
    judge: function () {
      var b = card(G.black);
      var h = topbar('Czar: ' + G.players[G.czar].name) +
        blackHTML(b, [], true) +
        '<p class="center"><b>Read each one aloud, then tap the best.</b></p>' +
        '<div class="subs">' + G.order.map(function (si, k) {
          var s = G.subs[si];
          return '<button class="sub' + (ui.judgeSel === si ? ' sel' : '') + '" data-act="judgePick" data-si="' + si + '"><span class="lbl">Answer ' + String.fromCharCode(65 + k) + '</span>' +
            fillHTML(b, s.cards.map(function (id) { return card(id).text; })) + '</button>';
        }).join('') + '</div>' +
        footer('<button class="btn" data-act="crown"' + (ui.judgeSel == null ? ' disabled' : '') + '>👑 Crown this answer</button>');
      return { html: h, footer: true };
    },
    reveal: function () {
      var L = G.last; var b = card(L.black); var w = G.players[L.winner];
      var gameOver = w.score >= G.target;
      var h = topbar('Round ' + G.round + ' result') +
        '<div class="center"><div class="big-emoji">' + (w.bot ? '🤖' : '🏆') + '</div><h2>' + esc(w.name) + ' wins the round!</h2>' +
        (w.bot ? '<p class="muted">Beaten by a random card generator. Have a long look at yourselves.</p>' : '') + '</div>' +
        blackHTML(b, L.cards.map(function (id) { return card(id).text; })) +
        '<div class="reveal-list">' + L.all.filter(function (s) { return s.p !== L.winner; }).map(function (s) {
          return '<div class="r"><b>' + esc(G.players[s.p].name) + ':</b> ' + esc(s.cards.map(function (id) { return whiteDisplay(card(id).text); }).join(' / ')) + '</div>';
        }).join('') + '</div>' +
        '<div class="panel">' + scoresHTML() + '</div>' +
        footer(gameOver ? '<button class="btn" data-act="toWin">See the champion 🏆</button>' : '<button class="btn" data-act="nextRound">Next round</button>');
      return { html: h, footer: true };
    },
    win: function () {
      var w = G.players.slice().sort(function (a, b) { return b.score - a.score; })[0];
      return { html:
        '<div class="center" style="margin-top:30px"><div class="big-emoji">🎉🏆🎉</div><div class="muted" style="margin-top:12px">Winner after ' + G.round + ' rounds</div>' +
        '<div class="pass-name">' + esc(w.name) + (w.bot ? ' 🤖' : '') + '</div><p style="margin-top:8px"><b>' + (w.bot ? esc(w.name) + ' wins. Nobody will ever speak of this.' : 'is officially the least sane person here.') + '</b></p></div>' +
        '<div class="panel">' + scoresHTML() + '</div>' +
        '<button class="btn" data-act="rematch">Rematch (same players)</button>' +
        '<button class="btn ghost" data-act="toSetup">New game / settings</button>' };
    }
  };

  // ---------- modals ----------
  function rulesModal() {
    openModal('<h2>How to play</h2><ol class="rules">' +
      '<li>Each round, one player is the <b>Card Czar</b> and reads the black card aloud.</li>' +
      '<li>Pass the phone around. Each player privately picks the funniest white card (or 2 cards, in order, for <b>Pick 2</b>), then taps <b>Hide &amp; pass</b>.</li>' +
      '<li>The Czar sees every answer anonymously, reads them out, and crowns a winner. The winner gets 1 point.</li>' +
      '<li>Hands refill to 10 and the Czar role moves on. First to the target score wins.</li>' +
      '<li><b>Swap hand:</b> spend 1 point to trade in your whole hand.</li>' +
      '<li><b>Bots 🤖</b> play automatically (no phone passing) and take turns as Czar, picking a winner at random.</li>' +
      '<li><b>Rando</b> is a bot that plays random cards. If Rando wins, everyone should feel bad.</li></ol>' +
      '<button class="btn" data-act="closeModal">Got it</button>');
  }
  function menuModal() {
    openModal('<h2>Scoreboard</h2>' + scoresHTML() +
      '<p class="muted">Round ' + G.round + ' · first to ' + G.target + ' · ' + G.wDraw.length + ' white / ' + G.bDraw.length + ' black cards left in the decks</p>' +
      '<button class="btn" data-act="closeModal">Back to game</button>' +
      '<button class="btn ghost" data-act="rulesFromMenu">How to play</button>' +
      '<button class="btn ghost" data-act="quitAsk">Quit game</button>');
  }
  function scoresModal() {
    openModal('<h2>Scoreboard</h2>' + scoresHTML() + '<button class="btn" data-act="closeModal">Close</button>');
  }

  // ---------- actions ----------
  function readNames() {
    var inputs = app.querySelectorAll('input[data-name]');
    for (var i = 0; i < inputs.length; i++) settings.names[+inputs[i].getAttribute('data-name')] = inputs[i].value.slice(0, 16);
  }
  function validate() {
    var names = settings.names.map(function (n) { return n.trim(); });
    if (names.some(function (n) { return !n; })) return 'Give every player a name (or remove the empty slot).';
    var lower = names.map(function (n) { return n.toLowerCase(); });
    if (lower.some(function (n, i) { return lower.indexOf(n) !== i; })) return 'Every player needs a different name.';
    if (settings.rando && lower.indexOf(BOT_NAME.toLowerCase()) >= 0) return '"Rando" is taken by the bot. Pick another name.';
    var taken = BOT_NAMES.slice(0, settings.bots).filter(function (b) { return lower.indexOf(b.toLowerCase()) >= 0; });
    if (taken.length) return '"' + taken[0] + '" is taken by a bot. Pick another name.';
    var total = names.length + botCount();
    if (total < 3) return 'You need at least 3 players (bots count).';
    if (total > 10) return 'Maximum 10 players.';
    if (names.length < 1) return 'You need at least 1 human player.';
    return '';
  }
  var ACTIONS = {
    adult: function () { show('setup'); },
    minor: function () { show('minor'); },
    toGate: function () { show('gate'); },
    addPlayer: function () { readNames(); settings.names.push(''); saveSettings(); ui.setupErr = ''; rerender(); },
    delPlayer: function (el) { readNames(); settings.names.splice(+el.getAttribute('data-i'), 1); saveSettings(); ui.setupErr = ''; rerender(); },
    tgtDown: function () { readNames(); settings.target = Math.max(3, settings.target - 1); saveSettings(); rerender(); },
    tgtUp: function () { readNames(); settings.target = Math.min(20, settings.target + 1); saveSettings(); rerender(); },
    toggleRando: function () {
      readNames(); settings.rando = !settings.rando;
      while (settings.names.length < minHumans()) settings.names.push('');
      if (settings.names.length > maxHumans()) settings.names = settings.names.slice(0, maxHumans());
      saveSettings(); ui.setupErr = ''; rerender();
    },
    botsDown: function () { readNames(); settings.bots = Math.max(0, settings.bots - 1); while (settings.names.length < minHumans()) settings.names.push(''); saveSettings(); ui.setupErr = ''; rerender(); },
    botsUp: function () {
      readNames(); if (settings.bots >= MAX_BOTS) return;
      settings.bots += 1;
      if (settings.names.length > maxHumans()) settings.names = settings.names.slice(0, maxHumans());
      saveSettings(); ui.setupErr = ''; rerender();
    },
    toggleFamily: function () { readNames(); settings.family = !settings.family; saveSettings(); rerender(); },
    rules: function () { rulesModal(); },
    start: function () {
      readNames(); saveSettings();
      var err = validate();
      if (err) { ui.setupErr = err; rerender(); return; }
      ui.setupErr = '';
      newGame(); botSubmit(); show('czar');
    },
    resume: function () { var g = loadGame(); if (!g) { rerender(); return; } G = g; G.subs = []; G.qi = 0; botSubmit(); show('czar'); },
    menu: function () { if (G) menuModal(); },
    scores: function () { scoresModal(); },
    closeModal: function () { closeOverlays(); },
    rulesFromMenu: function () { rulesModal(); },
    quitAsk: function () {
      openModal('<h2>Quit this game?</h2><p class="muted">Scores will be lost.</p><div class="row"><button class="btn ghost" data-act="closeModal">Keep playing</button><button class="btn danger" data-act="quitYes">Quit</button></div>');
    },
    quitYes: function () { store.del(KEY_GAME); G = null; show('setup'); },
    beginSubs: function () { G.phase = 'subs'; G.qi = 0; if (G.queue.length) show('pass'); else toJudge(); },
    showHand: function () { ui.sel = []; show('pick'); },
    pickCard: function (el) {
      var id = el.getAttribute('data-id'); var b = card(G.black);
      var n = ui.sel.indexOf(id);
      if (n >= 0) ui.sel.splice(n, 1);
      else if (b.pick === 1) ui.sel = [id];
      else if (ui.sel.length < b.pick) ui.sel.push(id);
      else { toast('You\'ve picked 2. Tap one to unpick it.'); return; }
      var y = window.pageYOffset || 0;
      rerender();
      try { window.scrollTo(0, y); } catch (e) { /* ignore */ }
    },
    swapAsk: function () {
      var p = G.players[G.queue[G.qi]];
      if (p.score < 1) return;
      openModal('<h2>Swap your whole hand?</h2><p>You\'ll trade in all 10 cards for fresh ones. This costs <b>1 point</b> (you have ' + p.score + ').</p><div class="row"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" data-act="swapYes">Swap (−1)</button></div>');
    },
    swapYes: function () {
      var p = G.players[G.queue[G.qi]];
      if (p.score < 1) { closeOverlays(); return; }
      p.score -= 1;
      G.wDisc = G.wDisc.concat(p.hand); p.hand = []; refill(p); ui.sel = [];
      show('pick'); toast('New hand dealt. −1 point.');
    },
    submit: function () {
      var b = card(G.black); if (ui.sel.length !== b.pick) return;
      var pi = G.queue[G.qi]; var p = G.players[pi]; var sel = ui.sel.slice();
      p.hand = p.hand.filter(function (id) { return sel.indexOf(id) < 0; });
      G.subs.push({ p: pi, cards: sel }); ui.sel = [];
      G.qi += 1;
      if (G.qi < G.queue.length) show('pass'); else toJudge();
    },
    showJudge: function () { show('judge'); },
    judgePick: function (el) {
      ui.judgeSel = +el.getAttribute('data-si');
      var y = window.pageYOffset || 0; rerender(); try { window.scrollTo(0, y); } catch (e) { /* ignore */ }
    },
    crown: function () {
      if (ui.judgeSel == null) return;
      crownSub(ui.judgeSel);
    },
    nextRound: function () { nextRound(); botSubmit(); show('czar'); },
    toWin: function () { store.del(KEY_GAME); show('win'); },
    rematch: function () { newGame(); botSubmit(); show('czar'); },
    toSetup: function () { G = null; store.del(KEY_GAME); show('setup'); }
  };
  function crownSub(si) {
    var s = G.subs[si];
    G.players[s.p].score += 1;
    G.last = { black: G.black, winner: s.p, cards: s.cards.slice(), all: G.subs.slice() };
    G.subs.forEach(function (x) { G.wDisc = G.wDisc.concat(x.cards); });
    G.bDisc.push(G.black);
    ui.judgeSel = null;
    G.phase = 'reveal';
    show('reveal');
  }
  var botTimer = null;
  function toJudge() {
    G.order = shuffle(G.subs.map(function (_, i) { return i; }));
    ui.judgeSel = null;
    if (G.players[G.czar].bot) {
      show('botJudge');
      var game = G, round = G.round;
      if (botTimer) clearTimeout(botTimer);
      botTimer = setTimeout(function () {
        botTimer = null;
        if (G !== game || G.round !== round || current.name !== 'botJudge' || G.phase === 'reveal') return;
        try { crownSub(G.order[Math.floor(rand() * G.order.length)]); } catch (e) { closeOverlays(); toast('Oops, something went wrong.'); }
      }, BOT_THINK_MS);
    } else show('passCzar');
  }

  function onTap(ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    if (Date.now() < lockUntil && !overlay.contains(el)) return;
    var fn = ACTIONS[el.getAttribute('data-act')];
    if (!fn) return;
    ev.preventDefault();
    try { fn(el); } catch (e) {
      // never leave the user stuck behind an overlay
      closeOverlays();
      toast('Oops, something went wrong.');
      if (window.console && console.error) console.error(e);
    }
  }
  document.addEventListener('click', onTap, false);
  overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeOverlays(); }, false);
  app.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t && t.hasAttribute && t.hasAttribute('data-name')) { settings.names[+t.getAttribute('data-name')] = t.value.slice(0, 16); saveSettings(); }
  }, false);

  // test hook (read-only snapshot)
  window.__CAS = { counts: function () { return { black: BLACK.length, white: WHITE.length, pick2: BLACK.filter(function (c) { return c.pick === 2; }).length, blackSafe: BLACK.filter(function (c) { return !c.spicy; }).length, whiteSafe: WHITE.filter(function (c) { return !c.spicy; }).length }; },
    state: function () { return G ? JSON.parse(JSON.stringify(G)) : null; }, fill: function (bid, texts) { return fillHTML(card(bid), texts); } };

  show('gate');
})();
</script>
</body>
</html>
